[project]
name = "patient-management-system"
version = "1.1.1"
description = "醫師門診管理系統 - Flask 病患管理系統"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.0.0",
]

[project.scripts]
app = "app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "database.py",
    "paths.py",
    "backup.py",
    "version.py",
    "updater.py",
    "cli.py",
    "templates/**",
    "static/**",
]
