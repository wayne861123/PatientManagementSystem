name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: windows-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 安裝相依套件
        shell: pwsh
        run: uv sync --all-extras

      # PyInstaller 會將進度資訊輸出到 stderr，PowerShell 預設會將其視為錯誤
      # 而讓步驟失敗，因此改用 cmd 執行並明確檢查退出碼
      - name: 打包驗證
        shell: cmd
        run: |
          uv run python build_exe.py --clean
          if %errorlevel% neq 0 (
            echo 打包失敗
            exit /b 1
          )

      - name: 確認執行檔存在
        shell: pwsh
        run: |
          if (Test-Path "dist\PatientManagementSystem\PatientManagementSystem.exe") {
            Write-Output "打包成功"
          } else {
            Write-Error "打包失敗：找不到執行檔"
            exit 1
          }
