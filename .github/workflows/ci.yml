name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: windows-latest

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v3

      - name: 安裝相依套件
        shell: pwsh
        run: uv sync --all-extras

      # 使用 bash 執行：PyInstaller 會將進度資訊輸出到 stderr，
      # PowerShell 預設會將其視為錯誤而讓步驟失敗，bash 則不會
      - name: 打包驗證
        shell: bash
        run: |
          set -o pipefail
          uv run python build_exe.py --clean 2>&1 | tee build_log.txt
          rc=${PIPESTATUS[0]}
          echo "exit code: $rc" | tee -a build_log.txt
          exit $rc

      - name: 上傳打包診斷資訊
        if: always()
        shell: pwsh
        run: |
          $log = if (Test-Path build_log.txt) { Get-Content build_log.txt -Raw } else { '(no log)' }
          $rc = if (Test-Path build_rc.txt) { Get-Content build_rc.txt -Raw } else { '(no rc)' }
          "### 打包診斷`n`n退出碼: $rc`n````n$log`n````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 確認執行檔存在
        shell: pwsh
        run: |
          if (Test-Path "dist\PatientManagementSystem\PatientManagementSystem.exe") {
            Write-Output "打包成功"
          } else {
            Write-Error "打包失敗：找不到執行檔"
            exit 1
          }
